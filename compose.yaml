services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SHOWCASE_DB: ${SHOWCASE_DB:-showcase}
      SHOWCASE_USER: ${SHOWCASE_USER}
      SHOWCASE_PASSWORD: ${SHOWCASE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: hello-butler-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  showcase:
    image: hello-butler-showcase:latest
    build:
      context: ./web/showcase
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./.env.production

    environment:
      SHOWCASE_HOST: postgres
      SHOWCASE_PORT: "5432"
      SHOWCASE_HTTP_HOST: "0.0.0.0"
      SHOWCASE_HTTP_PORT: "${SHOWCASE_HTTP_PORT:-8001}"

    ports:
      - "127.0.0.1:${SHOWCASE_HOST_PORT:-8002}:${SHOWCASE_HTTP_PORT:-8001}"

    volumes:
      - type: bind
        source: C:/hello-butler-production/showcase/releases
        target: /app/releases
        read_only: true

    depends_on:
      postgres:
        condition: service_healthy

  
  admin:
    image: hello-butler-admin:latest
    build:
      context: ./web/admin
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./.env.production

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SHOWCASE_HOST: postgres
      SHOWCASE_PORT: "5432"
      ADMIN_HTTP_HOST: "0.0.0.0"
      ADMIN_LOCAL_HTTP: "true"
      PORT: "3000"

    ports:
      - "127.0.0.1:3001:3000"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data: