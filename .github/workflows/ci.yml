name: CI Diagnosis

on:
  push:
  workflow_dispatch:

jobs:
  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    name: Diagnose + Backend
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      # ----------------------------------------------------------
      # Runner diagnosis
      # ----------------------------------------------------------

      - name: Diagnose runner identity
        run: |
          Write-Host "=== WHO AM I ==="
          whoami

          Write-Host "`n=== GROUPS / PRIVILEGES ==="
          whoami /groups

          Write-Host "`n=== RUNNER DIRECTORY ==="
          Get-Location

      - name: Diagnose environment
        run: |
          Write-Host "=== PROCESS PATH ==="
          $env:Path -split ';'

          Write-Host "`n=== USER PATH ==="
          [Environment]::GetEnvironmentVariable("Path", "User") -split ';'

          Write-Host "`n=== MACHINE PATH ==="
          [Environment]::GetEnvironmentVariable("Path", "Machine") -split ';'

          Write-Host "`n=== JAVA_HOME ==="
          Write-Host $env:JAVA_HOME

      - name: Diagnose required tools
        run: |
          Write-Host "=== GIT ==="
          where.exe git
          git --version

          Write-Host "`n=== UV ==="
          where.exe uv
          uv --version

          Write-Host "`n=== JAVA ==="
          where.exe java
          java -version

          Write-Host "`n=== DOCKER ==="
          where.exe docker
          docker --version

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Backend CI
      # ----------------------------------------------------------

      - name: Sync backend dependencies
        working-directory: backend
        run: |
          uv sync --frozen

      - name: Backend lint
        working-directory: backend
        run: |
          uv run ruff check .

      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build `
            -t hello-butler-backend-ci:${{ github.sha }} `
            .


  # ============================================================
  # SHOWCASE
  # ============================================================

  showcase:
    name: Showcase
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify pnpm
        run: |
          where.exe pnpm
          pnpm --version

      - name: Install showcase dependencies
        working-directory: web/showcase
        run: |
          pnpm install --frozen-lockfile

      - name: Build showcase
        working-directory: web/showcase
        run: |
          pnpm build

  # ============================================================
  # ANDROID CLIENT
  # ============================================================

  client:
    name: Diagnose + Android Client
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      # ----------------------------------------------------------
      # Runner / Android diagnosis
      # ----------------------------------------------------------

      - name: Diagnose runner identity
        run: |
          Write-Host "=== WHO AM I ==="
          whoami

          Write-Host "`n=== WORKING DIRECTORY ==="
          Get-Location

      - name: Diagnose Java
        run: |
          Write-Host "=== JAVA_HOME ==="
          Write-Host $env:JAVA_HOME

          Write-Host "`n=== JAVA PATH ==="
          where.exe java

          Write-Host "`n=== JAVA VERSION ==="
          java -version

      - name: Diagnose Android SDK
        run: |
          Write-Host "=== ANDROID_HOME ==="
          Write-Host $env:ANDROID_HOME

          Write-Host "`n=== ANDROID_SDK_ROOT ==="
          Write-Host $env:ANDROID_SDK_ROOT

          if ($env:ANDROID_HOME) {
            Write-Host "`n=== ANDROID_HOME EXISTS ==="
            Test-Path $env:ANDROID_HOME
          }

          if ($env:ANDROID_SDK_ROOT) {
            Write-Host "`n=== ANDROID_SDK_ROOT EXISTS ==="
            Test-Path $env:ANDROID_SDK_ROOT
          }

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Gradle diagnosis
      #
      # Use the repository's Gradle wrapper, not a globally
      # installed Gradle version.
      # ----------------------------------------------------------

      - name: Diagnose Gradle
        working-directory: client
        run: |
          .\gradlew.bat --version

      # ----------------------------------------------------------
      # Android CI
      #
      # For diagnosis, build the debug APK first.
      # Any failure stops this job immediately.
      # ----------------------------------------------------------

      - name: Build Android debug APK
        working-directory: client
        run: |
          .\gradlew.bat assembleDebug

  # ============================================================
  # DEPLOY
  #
  # Runs ONLY after:
  #
  #   backend  ✅
  #   showcase ✅
  #
  # If either fails, this job does not run.
  # ============================================================

  deploy:
    name: Deploy
    runs-on: [self-hosted, Windows, X64]

    needs:
      - backend
      - showcase
      - client

    defaults:
      run:
        shell: powershell

    steps:
      # Deploy is a new job, so get the repository/compose.yaml
      # into this job's workspace.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Backend deployment
      #
      # CI created:
      #
      #   hello-butler-backend-ci:<commit>
      #
      # Move :latest to that exact tested image.
      # ----------------------------------------------------------

      - name: Tag backend image for deployment
        run: |
          docker tag `
            hello-butler-backend-ci:${{ github.sha }} `
            hello-butler-backend:latest

      # ----------------------------------------------------------
      # Apply production Compose state
      #
      # PostgreSQL should remain running.
      # Backend is recreated if :latest changed.
      #
      # --no-build guarantees Compose does NOT rebuild backend.
      # ----------------------------------------------------------

      - name: Deploy backend
        run: |
          docker compose `
            --env-file ./.env.production `
            up -d --no-build

      # ----------------------------------------------------------
      # Verify deployment state
      # ----------------------------------------------------------

      - name: Show deployed containers
        run: |
          docker compose `
            --env-file ./.env.production `
            ps