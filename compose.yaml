services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SHOWCASE_DB: ${SHOWCASE_DB:-showcase}
      SHOWCASE_USER: ${SHOWCASE_USER}
      SHOWCASE_PASSWORD: ${SHOWCASE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-showcase.sh:/docker-entrypoint-initdb.d/init-showcase.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: hello-butler-backend:latest
    restart: unless-stopped
    env_file:
      - ./.env.production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: