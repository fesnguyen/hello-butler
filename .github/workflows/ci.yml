name: Hello Butler CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:

  # ============================================================
  # ENV Check
  # ============================================================
  runner-env:
  name: Runner Environment
  runs-on: [self-hosted, Windows, X64]

  steps:
    - name: Inspect runner environment
      shell: powershell
      run: |
        Write-Host "=== Identity ==="
        whoami
        Write-Host "Computer: $env:COMPUTERNAME"

        Write-Host "`n=== Environment ==="
        Write-Host "JAVA_HOME=$env:JAVA_HOME"
        Write-Host "USERPROFILE=$env:USERPROFILE"
        Write-Host "PATH=$env:PATH"

        Write-Host "`n=== Commands ==="
        Get-Command java -ErrorAction SilentlyContinue
        Get-Command uv -ErrorAction SilentlyContinue
        Get-Command node -ErrorAction SilentlyContinue
        Get-Command pnpm -ErrorAction SilentlyContinue
        Get-Command docker -ErrorAction SilentlyContinue

        Write-Host "`n=== Versions ==="
        java -version
        uv --version
        node --version
        pnpm --version
        docker --version

  # ============================================================
  # Backend
  # ============================================================
  backend:
    name: Backend
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          uv --version
          docker --version

      - name: Sync backend dependencies
        run: uv sync --frozen

      - name: Show Python version
        run: uv run python --version

      - name: Ruff
        run: uv run ruff check .

      - name: Run backend tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build backend Docker image
        run: docker build -t hello-butler-backend-ci:${{ github.sha }} .


  # ============================================================
  # Android Client
  # ============================================================
  android:
    name: Android
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"

      - name: Run Android tests
        run: .\gradlew.bat test

      - name: Build debug APK
        run: .\gradlew.bat assembleDebug

      - name: Show generated APK
        run: |
          Get-ChildItem -Path app\build\outputs\apk -Recurse -Filter *.apk |
            Select-Object FullName, Length


  # ============================================================
  # Showcase
  # ============================================================
  showcase:
    name: Showcase
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: web/showcase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          Write-Host "Runner: $env:COMPUTERNAME"
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build