name: CI Diagnosis

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    name: Diagnose + Backend
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      # ============================================================
      # 1. Runner diagnosis
      # ============================================================

      - name: Diagnose runner identity
        run: |
          Write-Host "=== WHO AM I ==="
          whoami

          Write-Host "`n=== GROUPS / PRIVILEGES ==="
          whoami /groups

          Write-Host "`n=== RUNNER DIRECTORY ==="
          Get-Location

      - name: Diagnose environment
        run: |
          Write-Host "=== PROCESS PATH ==="
          $env:Path -split ';'

          Write-Host "`n=== USER PATH ==="
          [Environment]::GetEnvironmentVariable("Path", "User") -split ';'

          Write-Host "`n=== MACHINE PATH ==="
          [Environment]::GetEnvironmentVariable("Path", "Machine") -split ';'

          Write-Host "`n=== JAVA_HOME ==="
          Write-Host $env:JAVA_HOME

      - name: Diagnose required tools
        run: |
          Write-Host "=== GIT ==="
          where.exe git
          git --version

          Write-Host "`n=== UV ==="
          where.exe uv
          uv --version

          Write-Host "`n=== JAVA ==="
          where.exe java
          java -version

          Write-Host "`n=== DOCKER ==="
          where.exe docker
          docker --version

      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ============================================================
      # 3. Backend
      # ============================================================

      - name: Sync backend dependencies
        working-directory: backend
        run: |
          uv sync --frozen

      - name: Run backend tests
        working-directory: backend
        run: |
          uv run pytest

      # ============================================================
      # 4. Docker build
      # ============================================================

      - name: Build backend Docker image
        working-directory: backend
        run: |
          docker build `
            -t hello-butler-backend-ci:${{ github.sha }} `
            .