services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hello_butler
      POSTGRES_USER: hello_butler
      POSTGRES_PASSWORD: hello_butler
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_butler -d hello_butler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
