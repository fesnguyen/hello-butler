name: Production Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment midway through.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      showcase: ${{ steps.filter.outputs.showcase }}
      admin: ${{ steps.filter.outputs.admin }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'compose.yaml'
            showcase:
              - 'web/showcase/**'
              - 'compose.yaml'
            admin:
              - 'web/admin/**'
            android:
              - 'client/**'

  deploy:
    name: Deploy Hello Butler
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.showcase == 'true' ||
      needs.changes.outputs.android == 'true' ||
      needs.changes.outputs.admin == 'true'
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell

    steps:
      # ============================================================
      # Checkout ONCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ------------------------------------------------------------
      # Production configuration
      # ------------------------------------------------------------

      - name: Copy production environment
        if: >-
            github.event_name == 'workflow_dispatch' || 
            needs.changes.outputs.backend == 'true' || 
            needs.changes.outputs.showcase == 'true' || 
            needs.changes.outputs.admin == 'true'
        run: |
          $source = "C:\hello-butler-configs\.env.production"
          $target = "${{ github.workspace }}\.env.production"

          if (-not (Test-Path $source)) {
            throw "Production environment file not found: $source"
          }

          Copy-Item $source $target -Force

      # ============================================================
      # BACKEND
      # ============================================================

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build backend image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        run: |
          $image = "hello-butler-backend-ci:${{ github.sha }}"

          docker build `
            --tag $image `
            ./backend

      # ------------------------------------------------------------
      # Promote
      # ------------------------------------------------------------

      - name: Promote backend image to latest
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        run: |
          docker tag `
            "hello-butler-backend-ci:${{ github.sha }}" `
            "hello-butler-backend:latest"

      # ------------------------------------------------------------
      # Deploy
      # ------------------------------------------------------------

      - name: Deploy backend
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        run: |
          docker compose `
            --env-file .env.production `
            up -d `
            --no-build `
            --no-deps `
            --force-recreate `
            backend

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------

      - name: Verify backend
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
        run: |
          $containerId = docker compose `
            --env-file .env.production `
            ps -q backend

          if (-not $containerId) {
            throw "Backend container was not created."
          }

          $running = docker inspect `
            --format "{{.State.Running}}" `
            $containerId

          if ($running -ne "true") {
            docker compose `
              --env-file .env.production `
              logs `
              --tail 100 `
              backend

            throw "Backend container is not running."
          }

          Write-Host "Backend deployment successful."
          Write-Host "Image: hello-butler-backend:latest"

      
      # ============================================================
      # SHOWCASE — Docker deployment
      # ============================================================

      - name: Build Showcase image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.showcase == 'true'
        run: |
          docker build `
            --tag "hello-butler-showcase-ci:${{ github.sha }}" `
            ./web/showcase

          if ($LASTEXITCODE -ne 0) {
            throw "Showcase image build failed."
          }

      - name: Promote Showcase image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.showcase == 'true'
        run: |
          docker tag `
            "hello-butler-showcase-ci:${{ github.sha }}" `
            "hello-butler-showcase:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Showcase image promotion failed."
          }

      - name: Deploy Showcase container
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.showcase == 'true'
        run: |
          docker compose `
            --env-file .env.production `
            up -d `
            --no-build `
            --no-deps `
            --force-recreate `
            showcase

          if ($LASTEXITCODE -ne 0) {
            throw "Showcase container deployment failed."
          }

      - name: Verify Showcase container
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.showcase == 'true'
        run: |
          $containerId = docker compose `
            --env-file .env.production `
            ps -q showcase

          if (-not $containerId) {
            throw "Showcase container was not created."
          }

          $running = docker inspect `
            --format "{{.State.Running}}" `
            $containerId

          if ($running -ne "true") {
            docker compose `
              --env-file .env.production `
              logs --tail 100 showcase

            throw "Showcase container is not running."
          }

          $url = "http://127.0.0.1:8002/api/applications"
          $healthy = $false

          for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $healthy) {
            docker compose `
              --env-file .env.production `
              logs --tail 100 showcase

            throw "Showcase health check failed: $url"
          }

          Write-Host "Showcase Docker deployment successful."

    
      # ============================================================
      # ADMIN — Docker deployment
      # ============================================================

      - name: Build Admin image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
        run: |
          docker build `
            --tag "hello-butler-admin-ci:${{ github.sha }}" `
            ./web/admin

          if ($LASTEXITCODE -ne 0) {
            throw "Admin image build failed."
          }

      - name: Promote Admin image
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
        run: |
          docker tag `
            "hello-butler-admin-ci:${{ github.sha }}" `
            "hello-butler-admin:latest"

          if ($LASTEXITCODE -ne 0) {
            throw "Admin image promotion failed."
          }

      - name: Deploy Admin container
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
        run: |
          docker compose `
            --env-file .env.production `
            up -d `
            --no-build `
            --no-deps `
            --force-recreate `
            admin

          if ($LASTEXITCODE -ne 0) {
            throw "Admin container deployment failed."
          }

      - name: Verify Admin container
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
        run: |
          $containerId = docker compose `
            --env-file .env.production `
            ps -q admin

          if ($LASTEXITCODE -ne 0 -or -not $containerId) {
            throw "Admin container was not created."
          }

          $running = docker inspect `
            --format "{{.State.Running}}" `
            $containerId

          if ($LASTEXITCODE -ne 0 -or $running -ne "true") {
            docker compose `
              --env-file .env.production `
              logs --tail 100 admin

            throw "Admin container is not running."
          }

          $url = "http://127.0.0.1:3001/admin/login"
          $healthy = $false

          for ($attempt = 1; $attempt -le 10; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $healthy) {
            docker compose `
              --env-file .env.production `
              logs --tail 100 admin

            throw "Admin health check failed: $url"
          }

          Write-Host "Admin Docker deployment successful."


      # ============================================================
      # ANDROID
      # ============================================================

      # ------------------------------------------------------------
      # Production configuration
      # ------------------------------------------------------------

      - name: Copy production Gradle properties
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
        run: |
          $source = "C:\hello-butler-configs\gradle.properties"
          $target = "${{ github.workspace }}\client\gradle.properties"

          if (-not (Test-Path $source)) {
            throw "Production Gradle properties not found: $source"
          }

          Copy-Item $source $target -Force

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
        working-directory: client
        run: |
          .\gradlew.bat assembleRelease

      # ------------------------------------------------------------
      # Sign
      # ------------------------------------------------------------

      - name: Sign release APK
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
        run: |
          $unsignedApk = "${{ github.workspace }}\client\app\build\outputs\apk\release\app-release-unsigned.apk"
          $signedApk = "${{ github.workspace }}\client\app\build\outputs\apk\release\app-release.apk"

          $keystore = "C:\hello-butler-configs\hello-butler-release.jks"

          if (-not (Test-Path $unsignedApk)) {
            throw "Unsigned release APK was not produced: $unsignedApk"
          }

          if (-not (Test-Path $keystore)) {
            throw "Release keystore not found: $keystore"
          }

          $properties = @{}

          Get-Content "C:\hello-butler-configs\gradle.properties" |
            ForEach-Object {
              if ($_ -match '^\s*([^#][^=]*)=(.*)$') {
                $properties[$matches[1].Trim()] = $matches[2].Trim()
              }
            }

          $storePassword = $properties["RELEASE_KEYSTORE_PASSWORD"]
          $keyPassword = $properties["RELEASE_KEY_PASSWORD"]

          if (-not $storePassword) {
            throw "RELEASE_KEYSTORE_PASSWORD is missing."
          }

          if (-not $keyPassword) {
            throw "RELEASE_KEY_PASSWORD is missing."
          }

          $buildTools = Get-ChildItem `
            "$env:ANDROID_HOME\build-tools" `
            -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $buildTools) {
            throw "Android SDK Build Tools not found."
          }

          $apksigner = Join-Path `
            $buildTools.FullName `
            "apksigner.bat"

          if (-not (Test-Path $apksigner)) {
            throw "apksigner not found: $apksigner"
          }

          & $apksigner sign `
            --ks $keystore `
            --ks-key-alias "hello-butler" `
            --ks-pass "pass:$storePassword" `
            --key-pass "pass:$keyPassword" `
            --out $signedApk `
            $unsignedApk

          if ($LASTEXITCODE -ne 0) {
            throw "APK signing failed."
          }

      # ------------------------------------------------------------
      # Verify signature
      # ------------------------------------------------------------

      - name: Verify signed APK
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
        run: |
          $apk = "${{ github.workspace }}\client\app\build\outputs\apk\release\app-release.apk"

          if (-not (Test-Path $apk)) {
            throw "Signed release APK was not produced: $apk"
          }

          $buildTools = Get-ChildItem `
            "$env:ANDROID_HOME\build-tools" `
            -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $buildTools) {
            throw "Android SDK Build Tools not found."
          }

          $apksigner = Join-Path `
            $buildTools.FullName `
            "apksigner.bat"

          if (-not (Test-Path $apksigner)) {
            throw "apksigner not found: $apksigner"
          }

          & $apksigner verify --verbose $apk

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

          Write-Host "APK signature verified successfully."

      # ------------------------------------------------------------
      # Publish
      # ------------------------------------------------------------

      - name: Publish APK to Showcase
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
        run: |
          $source = "${{ github.workspace }}\client\app\build\outputs\apk\release\app-release.apk"

          $targetDirectory = "C:\hello-butler-production\showcase\releases"
          $target = "$targetDirectory\hello-butler-v0.1.0.apk"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $targetDirectory | Out-Null

          Copy-Item $source $target -Force

          Write-Host "APK published:"
          Write-Host $target