services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hello_butler
      POSTGRES_USER: hello_butler
      POSTGRES_PASSWORD: hello_butler
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_butler -d hello_butler"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://hello_butler:hello_butler@postgres:5432/hello_butler
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: