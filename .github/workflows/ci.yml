name: Hello Butler CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  diagnose-runner-environment:
  name: Diagnose runner environment
  runs-on: [self-hosted, Windows, X64]

  steps:
    - name: Diagnose runner environment
      shell: powershell
      run: |
        Write-Host "=== USER ==="
        whoami

        Write-Host "=== PATH ==="
        $env:Path -split ';'

        Write-Host "=== DOCKER ==="
        where.exe docker 2>$null
        Get-Command docker -ErrorAction SilentlyContinue

        Write-Host "=== FILE EXISTS? ==="
        Test-Path "C:\Users\ADMIN\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"

        Write-Host "=== SYSTEM PATH ==="
        [Environment]::GetEnvironmentVariable("Path", "Machine")

  # ============================================================
  # Backend
  # ============================================================
  backend:
    name: Backend
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Show Python version
        run: uv run python --version

      - name: Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t hello-butler-backend-ci:${{ github.sha }} .


  # ============================================================
  # Android
  # ============================================================
  android:
    name: Android
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: tools platform-tools platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        run: |
          java -version
          .\gradlew.bat --version

      - name: Run tests
        run: .\gradlew.bat test --no-daemon

      - name: Build debug APK
        run: .\gradlew.bat assembleDebug --no-daemon

      - name: Show generated APK
        run: |
          Get-ChildItem -Path app\build\outputs\apk -Recurse -Filter *.apk |
            Select-Object FullName, Length


  # ============================================================
  # Showcase
  # ============================================================
  showcase:
    name: Showcase
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: web/showcase

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/showcase/pnpm-lock.yaml

      - name: Show environment
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build