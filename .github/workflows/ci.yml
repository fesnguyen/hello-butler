name: Showcase CI/CD

on:
  push:
    branches:
      - feature/implement_CI_CD
    paths:
      - "web/showcase/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  showcase:
    name: Build and Deploy Showcase
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ------------------------------------------------------------
      # Production configuration
      # ------------------------------------------------------------

      - name: Copy production environment
        run: |
          $source = "C:\hello-butler-configs\.env.production"
          $target = "${{ github.workspace }}\.env.production"

          if (-not (Test-Path $source)) {
            throw "Production environment file not found: $source"
          }

          Copy-Item $source $target -Force

      # ------------------------------------------------------------
      # Install + validate + build
      # ------------------------------------------------------------

      - name: Install dependencies
        working-directory: web/showcase
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web/showcase
        run: pnpm lint

      - name: Test
        working-directory: web/showcase
        run: pnpm test

      - name: Build production Showcase
        working-directory: web/showcase
        run: pnpm build

      # ------------------------------------------------------------
      # Deploy production build
      # ------------------------------------------------------------

      - name: Deploy Showcase
        run: |
          $source = "${{ github.workspace }}\web\showcase"
          $target = "C:\hello-butler-production\showcase"

          if (-not (Test-Path "$source\dist\index.html")) {
            throw "Showcase frontend build is missing."
          }

          if (-not (Test-Path "$source\dist-server\server\index.js")) {
            throw "Showcase backend build is missing."
          }

          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item "$source\dist" "$target\dist" -Recurse -Force
          Copy-Item "$source\dist-server" "$target\dist-server" -Recurse -Force

      # ------------------------------------------------------------
      # Verify final production output
      # ------------------------------------------------------------

      - name: Verify deployment
        run: |
          $target = "C:\hello-butler-production\showcase"

          if (-not (Test-Path "$target\dist\index.html")) {
            throw "Production frontend is missing."
          }

          if (-not (Test-Path "$target\dist-server\server\index.js")) {
            throw "Production backend is missing."
          }

          Write-Host "Showcase production build deployed successfully."
          Write-Host "Frontend: $target\dist"
          Write-Host "Backend:  $target\dist-server"